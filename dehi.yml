version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: smarttask-postgres
    restart: always
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpass
      POSTGRES_DB: smarttask_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smarttask-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartuser -d smarttask_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API REST Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarttask-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpass
      POSTGRES_DB: smarttask_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smarttask-net

  # Interface Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarttask-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - smarttask-net

# Réseau Docker dédié
networks:
  smarttask-net:
    driver: bridge

# Volume persistant pour la base de données
volumes:
  postgres_data:
    driver: local
